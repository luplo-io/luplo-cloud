name: release

# Triggered by any tag shaped like `v0.1.0`. Builds the
# `luplo-cloud` wheel + sdist and publishes to PyPI via Trusted
# Publishing (no API token — GitHub OIDC is trusted by a publisher
# entry configured on pypi.org).
#
# To cut a release:
#   git tag v0.2.0
#   git push origin v0.2.0
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --no-dev

      - name: build wheel + sdist
        run: |
          uv build
          ls -la dist/

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
