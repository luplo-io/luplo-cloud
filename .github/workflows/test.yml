name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luplo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Both glossary-ext alembic env (LUPLO_EXT_DB_URL → LUPLO_DB_URL)
      # and the test conftest (LUPLO_EXT_TEST_DB_URL → LUPLO_TEST_DB_URL)
      # need an OSS-DB pointer; set them all to the CI service container.
      LUPLO_DB_URL: postgresql://postgres:postgres@localhost:5432/luplo_test
      LUPLO_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/luplo_test
      LUPLO_EXT_DB_URL: postgresql://postgres:postgres@localhost:5432/luplo_test
      LUPLO_EXT_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/luplo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      - name: provision pgvector + OSS extensions
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d luplo_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;
                CREATE EXTENSION IF NOT EXISTS citext;
                CREATE EXTENSION IF NOT EXISTS pgcrypto;
                CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: lp migrate (OSS luplo schema)
        run: uv run lp migrate

      - name: alembic upgrade (glossary-ext partition)
        # `lps-ext-migrate` assumes a wheel install (locates the .ini via
        # site-packages/__file__ traversal); CI runs an editable install
        # from source, so call alembic directly.
        run: uv run alembic -c alembic_luplo_ext.ini upgrade head

      - run: uv run ruff check src tests
      - run: uv run pytest -q
