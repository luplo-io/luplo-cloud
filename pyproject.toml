[project]
name = "luplo-cloud"
version = "0.1.0"
description = "CLI for luplo cloud — manage access keys, login, and configure MCP saas backend."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "luplo", email = "ehanyul99@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12,<1.0",
    "httpx>=0.28,<0.29",
    "keyring>=25.0,<26.0",
]

[project.urls]
Homepage = "https://github.com/luplo-io/luplo-cloud"
Issues = "https://github.com/luplo-io/luplo-cloud/issues"

[project.scripts]
lps = "luplo_cloud.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.8,<0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luplo_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
extend-ignore = ["B008"]
